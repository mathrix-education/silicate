<mat-card>
  <mat-card-header>
    <mat-card-title>Debug</mat-card-title>
    <mat-card-subtitle>Informations internes</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content fxLayout="column">
    <mat-slide-toggle [(ngModel)]="demo.editable">@Input() [editable]: boolean</mat-slide-toggle>

    <div>
      <button mat-button color="primary" (click)="pull()">Pull</button>
      <button mat-button color="primary" (click)="push()">Push</button>
    </div>

    <mat-form-field>
      <textarea
        placeholder="Entrer le JSON à tester ici..."
        matInput
        cdkTextareaAutosize
        [(ngModel)]="buffer">
      </textarea>
    </mat-form-field>
  </mat-card-content>
</mat-card>
