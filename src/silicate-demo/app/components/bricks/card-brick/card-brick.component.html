<mat-card>
  <mat-card-header>
    <mat-card-title>
      <h3>
        <mtx-silicate-editable [(content)]="data.title"></mtx-silicate-editable>
      </h3>
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <mtx-silicate-wrapper
      [(data)]="data.data"
      [bricks]="bricks"
      [editable]="silicate.editable"
    ></mtx-silicate-wrapper>
  </mat-card-content>
</mat-card>
