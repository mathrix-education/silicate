<div fxLayout="row">
  <mat-card fxFlex="20%">
    <mat-card-header>
      <mat-card-title>Démonstration</mat-card-title>
      <mat-card-subtitle>Charger des données</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content fxLayout="column">
      <mat-form-field>
        <mat-label>Exemple à charger</mat-label>
        <mat-select [(value)]="data">
          <mat-option *ngFor="let f of fixtures" [value]="f.value">
            {{f.name}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </mat-card-content>
  </mat-card>

  <mat-card fxFlex="60%">
    <mat-card-header>
      <mat-card-title>Éditeur</mat-card-title>
      <mat-card-subtitle>Voici Silicate !</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <mtx-silicate-wrapper fxFlex="grow"
                            [editable]="editable"
                            [bricks]="bricks"
                            [(data)]="data">
      </mtx-silicate-wrapper>
    </mat-card-content>
  </mat-card>

  <mat-card fxFlex="20%">
    <mat-card-header>
      <mat-card-title>Options</mat-card-title>
      <mat-card-subtitle>Réglages possibles</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <mat-slide-toggle [(ngModel)]="editable">@Input() [editable]: boolean</mat-slide-toggle>
    </mat-card-content>
  </mat-card>
</div>
