<h1 mat-dialog-title>Choix de l'image</h1>
<div mat-dialog-content>
  <div class="form-content">
    <mat-form-field>
      <mat-label>URL de l'image</mat-label>
      <label>
        <input [(ngModel)]="data.src"
               matInput
               placeholder="https://placehold.it/400x150"
               type="url">
      </label>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Légende</mat-label>
      <label>
        <input [(ngModel)]="data.alt"
               matInput
               placeholder="Description"
               type="text">
      </label>
    </mat-form-field>

    <mat-checkbox [(ngModel)]="data.displayAlt">
      Afficher la légendes
    </mat-checkbox>
  </div>
</div>

<div mat-dialog-actions align="end">
  <button [mat-dialog-close]="data" mat-button>Sauvegarder</button>
</div>
