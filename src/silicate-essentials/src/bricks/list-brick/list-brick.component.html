<ng-container [ngSwitch]="data.type">
  <ul *ngSwitchCase="'ul'">
    <ng-content *ngTemplateOutlet="listElement"></ng-content>
  </ul>

  <ol *ngSwitchCase="'ol'">
    <ng-content *ngTemplateOutlet="listElement"></ng-content>
  </ol>
</ng-container>


<!-- list element -->
<ng-template #listElement>
  <ng-container *ngFor="let item of data.items">
    <li>
      <p silicate [data]="item"></p>
    </li>
  </ng-container>

  <!-- last row : add new line -->
  <span></span> <!-- do not remove, useful for grid -->
</ng-template>
