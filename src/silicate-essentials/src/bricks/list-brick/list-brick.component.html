<ng-container [ngSwitch]="data.type">
  <ul *ngSwitchCase="'ul'" fxFlex="grow">
    <li
      *ngFor="let item of data.items; let i = index; trackBy: trackByFn"
      silicate
      (keydown.enter)="onEnter($event, i)"
      [(data)]="data.items[i]">
    </li>
  </ul>

  <ol *ngSwitchCase="'ol'" fxFlex="grow">
    <li
      *ngFor="let item of data.items; let i = index; trackBy: trackByFn"
      silicate
      (keydown.enter)="onEnter($event, i)"
      [(data)]="data.items[i]">
    </li>
  </ol>
</ng-container>

<button
  *ngIf="silicate.editable"
  mat-button
  mat-icon-button [matMenuTriggerFor]="menu">
  <mat-icon>swap_horiz</mat-icon>
</button>

<mat-menu #menu="matMenu">
  <!--suppress TypeScriptValidateTypes -->
  <button
    mat-menu-item
    [disabled]="data.type === 'ul'"
    (click)="data.type = 'ul'">
    <mat-icon>format_list_bulleted</mat-icon>
    Liste non-ordonnée
  </button>

  <!--suppress TypeScriptValidateTypes -->
  <button
    mat-menu-item
    [disabled]="data.type === 'ol'"
    (click)="data.type = 'ol'">
    <mat-icon>format_list_numbered</mat-icon>
    Liste ordonnée
  </button>
</mat-menu>
