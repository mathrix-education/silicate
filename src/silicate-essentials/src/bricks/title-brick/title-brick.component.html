<h1 *ngIf="data.heading === 'h1'" silicate fxFlex="grow" [(data)]="data.text"></h1>
<h2 *ngIf="data.heading === 'h2'" silicate fxFlex="grow" [(data)]="data.text"></h2>
<h3 *ngIf="data.heading === 'h3'" silicate fxFlex="grow" [(data)]="data.text"></h3>
<h4 *ngIf="data.heading === 'h4'" silicate fxFlex="grow" [(data)]="data.text"></h4>
<h5 *ngIf="data.heading === 'h5'" silicate fxFlex="grow" [(data)]="data.text"></h5>
<h6 *ngIf="data.heading === 'h6'" silicate fxFlex="grow" [(data)]="data.text"></h6>

<button
  *ngIf="silicate.editable"
  mat-button
  mat-icon-button [matMenuTriggerFor]="menu">
  <mat-icon>swap_horiz</mat-icon>
</button>

<mat-menu #menu="matMenu">
  <button
    *ngFor="let heading of allowedHeadings; let i = index"
    mat-menu-item
    [disabled]="data.heading === heading"
    (click)="data.heading = heading">
    Titre {{ i + 1 }}
  </button>
</mat-menu>
