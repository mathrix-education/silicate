<ng-container [ngSwitch]="data.heading">
  <h1 *ngSwitchCase="'h1'"
      silicate
      [data]="data.text">
  </h1>

  <h2 *ngSwitchCase="'h2'"
      silicate
      [data]="data.text">
  </h2>

  <h3 *ngSwitchCase="'h3'"
      silicate
      [data]="data.text">
  </h3>

  <h4 *ngSwitchCase="'h4'"
      silicate
      [data]="data.text">
  </h4>

  <h5 *ngSwitchCase="'h5'"
      silicate
      [data]="data.text">
  </h5>

  <h6 *ngSwitchCase="'h6'"
      silicate
      [data]="data.text">
  </h6>
</ng-container>
