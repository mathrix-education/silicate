<div>
  <ng-container *ngIf="!data.src">
    <button (click)="openDialogOrFullscreen()" color="primary" mat-flat-button>Choisir l'image</button>
  </ng-container>

  <figure>
    <img
      *ngIf="data.src"
      [alt]="data.alt"
      [src]="data.src"
      (click)="openDialogOrFullscreen()">

    <figcaption *ngIf="data.displayAlt">
      <p silicate [(data)]="data.alt"></p>
    </figcaption>
  </figure>
</div>


<div
  *ngIf="fullscreen"
  class="image-fullscreen"
  (click)="openDialogOrFullscreen()">

  <figure>
    <img
      *ngIf="data.src"
      [alt]="data.alt"
      [src]="data.src">

    <figcaption *ngIf="data.displayAlt">
      <p silicate [data]="data.alt"></p>
    </figcaption>
  </figure>
</div>
