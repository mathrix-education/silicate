<figure>
  <img
    (click)="openFullScreen()"
    *ngIf="data.src"
    [alt]="data.alt"
    [src]="data.src">

  <figcaption *ngIf="data.displayAlt">{{data.alt}}</figcaption>
</figure>


<div
  *ngIf="fullscreen"
  class="image-fullscreen"
  (click)="openFullScreen()">

  <figure>
    <img
      *ngIf="data.src"
      [alt]="data.alt"
      [src]="data.src">

    <figcaption
      *ngIf="data.displayAlt">
      {{data.alt}}
    </figcaption>
  </figure>
</div>
