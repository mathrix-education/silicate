<div>
  <ng-container *ngIf="!data.src">
    <button (click)="openDialog()" color="primary" mat-flat-button>Choisir l'image</button>
  </ng-container>

  <figure>
    <img (click)="openDialog()"
      *ngIf="data.src"
      [alt]="data.alt"
      [src]="data.src">

    <figcaption *ngIf="data.displayAlt" silicate [(data)]="data.alt"></figcaption>
  </figure>
</div>
