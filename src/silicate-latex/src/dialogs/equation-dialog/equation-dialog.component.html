<h1 mat-dialog-title>Éditeur d'équation</h1>
<div mat-dialog-content>
  <div fxLayout="column">
    <mat-form-field>
      <mat-label>Équation</mat-label>
      <label>
        <textarea [(ngModel)]="equation"
                  cdkAutosizeMinRows="1"
                  cdkTextareaAutosize
                  matInput
                  placeholder="f(x) = x^2"
                  type="text">
        </textarea>
      </label>
    </mat-form-field>

    <ng-katex [equation]="equation"
              [options]="{displayMode: true}">
    </ng-katex>
  </div>
</div>

<div mat-dialog-actions>
  <button (click)="dialogRef.close()" mat-button>Annuler</button>
  <button [mat-dialog-close]="equation" mat-button>Sauvegarder</button>
</div>
