<h1 mat-dialog-title>Éditeur LaTeX</h1>
<div mat-dialog-content>
  <div class="form-content">
    <mat-accordion>
      <mat-expansion-panel
        [expanded]="false"
        (afterExpand)="focusEquation()">
        <mat-expansion-panel-header>
          <mat-panel-title>
            Symboles et sigles
          </mat-panel-title>
        </mat-expansion-panel-header>

        <mat-grid-list cols="9">
          <mat-grid-tile
            *ngFor="let symbol of symbols">
            <button
              mat-raised-button
              (mousedown)="applySnippet($event, symbol)">
              <silicate-katex
                [equation]="symbol"
                [options]="{displayMode: true}">
              </silicate-katex>
            </button>
          </mat-grid-tile>
        </mat-grid-list>
      </mat-expansion-panel>


      <mat-expansion-panel
        [expanded]="false"
        (afterExpand)="focusEquation()">
        <mat-expansion-panel-header>
          <mat-panel-title>
            Expressions
          </mat-panel-title>
        </mat-expansion-panel-header>

        <mat-grid-list cols="7">
          <mat-grid-tile
            *ngFor="let snippet of snippets">
            <button
              mat-raised-button
              (mousedown)="applySnippet($event, snippet)">
              <silicate-katex
                [equation]="snippet"
                [options]="{displayMode: true}">
              </silicate-katex>
            </button>
          </mat-grid-tile>
        </mat-grid-list>
      </mat-expansion-panel>
    </mat-accordion>

    <mat-form-field>
      <mat-label>Équation</mat-label>
      <textarea
          #equation
          cdkAutosizeMinRows="1"
          cdkTextareaAutosize
          cdkFocusInitial
          matInput
          placeholder="f(x) = x^2"
          [(ngModel)]="data.equation">
        </textarea>
    </mat-form-field>

    <mat-form-field *ngIf="data.enableDescription">
      <mat-label>Description</mat-label>
      <input matInput placeholder="Description" spellcheck="true" [(ngModel)]="data.description">
    </mat-form-field>

    <figure>
      <silicate-katex
        [equation]="data.equation"
        [options]="{displayMode: true}"
        (error)="hasError = true">
      </silicate-katex>
      <figcaption>
        {{ data.description }}
      </figcaption>
    </figure>
  </div>
</div>

<div mat-dialog-actions>
  <button
    *ngIf="!displayDeleteButton"
    mat-button
    [mat-dialog-close]="undefined">
    Supprimer
  </button>

  <button
    mat-button
    (click)="closeWithoutSaving()">Annuler
  </button>

  <button
    mat-button
    color="primary"
    [disabled]="hasError || data.equation === ''"
    [mat-dialog-close]="data">Sauvegarder
  </button>
</div>
