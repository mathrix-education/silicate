<h1 mat-dialog-title>Éditeur d'équation</h1>
<div mat-dialog-content>
  <div fxLayout="column" fxLayoutGap="16px">
    <div fxLayout="row"fxLayoutGap="8px">
      <button
        *ngFor="let s of snippets"
        mat-raised-button
        [disabled]="!snippetsActive"
        (mousedown)="applySnippet($event, s)">
        <ng-katex [equation]="s"></ng-katex>
      </button>
    </div>

    <mat-form-field>
      <mat-label>Équation</mat-label>
      <label>
        <textarea cdkAutosizeMinRows="1"
                  cdkTextareaAutosize
                  matInput
                  placeholder="f(x) = x^2"
                  (focus)="snippetsActive = true"
                  (blur)="snippetsActive = false"
                  [(ngModel)]="equation">
        </textarea>
      </label>
    </mat-form-field>

    <ng-katex [equation]="equation" [options]="{displayMode: true}"></ng-katex>
  </div>
</div>

<div mat-dialog-actions>
  <button (click)="delete()" mat-button>Supprimer</button>
  <button (click)="dialogRef.close()" mat-button>Annuler</button>
  <button (click)="apply()" mat-button>Sauvegarder</button>
</div>
