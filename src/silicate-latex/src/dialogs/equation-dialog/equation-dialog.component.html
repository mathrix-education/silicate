<h1 mat-dialog-title>Éditeur d'équation</h1>
<div mat-dialog-content>
  <div fxLayout="column" fxLayoutGap="16px">
    <mat-accordion>
      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-panel-title>
            Symboles et sigles
          </mat-panel-title>
        </mat-expansion-panel-header>

        <mat-grid-list cols="9">
          <mat-grid-tile
            *ngFor="let s of symbols">
            <button
              mat-raised-button
              (mousedown)="applySnippet($event, s)">
              <ng-katex [equation]="s" [options]="{displayMode: true}"></ng-katex>
            </button>
          </mat-grid-tile>
        </mat-grid-list>
      </mat-expansion-panel>


      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-panel-title>
            Expressions
          </mat-panel-title>
        </mat-expansion-panel-header>

        <mat-grid-list cols="7">
          <mat-grid-tile
            *ngFor="let s of snippets">
            <button
              mat-raised-button
              (mousedown)="applySnippet($event, s)">
              <ng-katex [equation]="s" [options]="{displayMode: true}"></ng-katex>
            </button>
          </mat-grid-tile>
        </mat-grid-list>
      </mat-expansion-panel>
    </mat-accordion>

    <mat-form-field>
      <mat-label>Équation</mat-label>
      <label>
        <textarea cdkAutosizeMinRows="1"
                  cdkTextareaAutosize
                  matInput
                  placeholder="f(x) = x^2"
                  (focus)="equationFormFieldFocused = true"
                  (blur)="equationFormFieldFocused = false"
                  [(ngModel)]="data.equation">
        </textarea>
      </label>
    </mat-form-field>

    <mat-form-field *ngIf="data.enableDescription">
      <mat-label>Description</mat-label>
      <label>
        <input matInput placeholder="Email" [(ngModel)]="data.description">
      </label>
    </mat-form-field>

    <figure>
      <ng-katex [equation]="data.equation" [options]="{displayMode: true}"></ng-katex>
      <figcaption>
        {{ data.description }}
      </figcaption>
    </figure>
  </div>
</div>

<div mat-dialog-actions>
  <button mat-button [mat-dialog-close]="{equation: 'delete'}">Supprimer</button>
  <button mat-button (click)="dialogRef.close()">Annuler</button>
  <button mat-button [mat-dialog-close]="data">Sauvegarder</button>
</div>
