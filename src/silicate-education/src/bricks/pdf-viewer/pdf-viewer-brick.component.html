<mat-form-field *ngIf="silicate.editable">
  <input matInput placeholder="URL du PDF" [(ngModel)]="data.url">
</mat-form-field>

<button
  mat-raised-button
  color="primary"
  (click)="data.state.viewerOpen = !data.state.viewerOpen">
  {{ data.state.viewerOpen ? texts.close : texts.open }}
</button>

<embed *ngIf="data.state.viewerOpen"
       frameborder="0"
       webkitallowfullscreen
       mozallowfullscreen
       allowfullscreen
       [src]="data.url | safe:'resourceUrl'">
