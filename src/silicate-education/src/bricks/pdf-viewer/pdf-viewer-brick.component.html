<mat-form-field *ngIf="silicate.editable">
  <input matInput placeholder="URL du PDF" [(ngModel)]="data.url">
</mat-form-field>

<button
  mat-raised-button
  color="primary"
  (click)="viewerOpen = !viewerOpen">
  {{ viewerOpen ? texts.close : texts.open }}
</button>

<embed *ngIf="viewerOpen"
       frameborder="0"
       webkitallowfullscreen
       mozallowfullscreen
       allowfullscreen
       [src]="data.url | safe:'resourceUrl'">
