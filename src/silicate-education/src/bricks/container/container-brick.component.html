<div #wrapper class="wrapper">
  <h3 #titleContainer>
    <span
      *ngIf="data.prefix"
      class="prefix">
      {{data.prefix}}
    </span>

    <span>{{ title }}</span>

    <span
      *ngIf="data.suffix"
      class="suffix">{{data.suffix}}
    </span>
  </h3>

  <silicate-wrapper [data]="data.wall"></silicate-wrapper>
</div>
