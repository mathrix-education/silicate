<div #wrapper class="wrapper">
  <h3 #titleContainer>
    <span
        #prefix
        *ngIf="silicate.editable || data.prefix"
        class="prefix"
        silicate
        [data]="data.prefix"
        (dataChange)="onPrefixChange($event)">
    </span>

    <span>{{ title }}</span>

    <span
        #suffix
        *ngIf="silicate.editable || data.suffix"
        class="suffix"
        silicate
        [(data)]="data.suffix">
    </span>

    <ng-container *ngIf="silicate.editable">
      <button
        mat-button
        mat-icon-button
        [matMenuTriggerFor]="menu">
        <mat-icon>swap_horiz</mat-icon>
      </button>

      <mat-menu #menu="matMenu">
        <button
          *ngFor="let bv of containerBrickVariants"
          mat-menu-item
          [disabled]="data.variant === bv.variant"
          (click)="onVariantChange(bv)">
          {{ bv.title }}
        </button>
      </mat-menu>
    </ng-container>
  </h3>

  <silicate-wrapper
    [(data)]="data.wall"
    [editable]="silicate.editable"
    [allowist]="['text']">
  </silicate-wrapper>
</div>
