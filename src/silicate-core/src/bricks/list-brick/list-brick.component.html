<ul>
  <li *ngFor="let item of items; let i = index; trackBy: trackByFn">
    <mtx-silicate-editable [placeholder]="'Texte...'"
                           [content]="items[i]"
                           (contentChange)="this.setItemContent(i, $event)"
                           (enter)="onEnter($event, i)"
                           (delete)="onDeleteItem($event, i)">
    </mtx-silicate-editable>
  </li>
</ul>
