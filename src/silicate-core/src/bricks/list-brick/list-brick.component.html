<ul>
  <li *ngFor="let item of data.items; let i = index; trackBy: trackByFn">
    <mtx-silicate-editable [placeholder]="'Texte...'"
                           [(content)]="data.items[i]"
                           (enter)="onEnter($event, i)"
                           (delete)="data.items.splice(i, 1)">
    </mtx-silicate-editable>
  </li>
</ul>
