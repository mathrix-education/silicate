<div fxLayout="row" fxLayoutGap="16px" fxLayoutAlign="center center">
  <div fxFlex="grow">
    <div class="player-handler ratio ratio-16-9">
      <div *ngIf="loading" class="spinner-handler">
        <mat-spinner></mat-spinner>
      </div>

      <ng-container [ngSwitch]="type">
        <lib-ytplayer *ngSwitchCase="'youtube'"
                      #youtubePlayer [videoId]="videoId"
                      (ready)="loading = false"></lib-ytplayer>
        <mtx-vimeo-player
          *ngSwitchCase="'vimeo'"
          [videoId]="videoId"
          (ready)="loading = false">
        </mtx-vimeo-player>
      </ng-container>
    </div>
  </div>

  <div fxFlex="30%" fxLayout="column" fxLayoutGap="16px">
    <mat-card *ngIf="editable">
      <mat-card-header>
        <mat-card-header>Options de la vidéo</mat-card-header>
      </mat-card-header>

      <mat-card-content fxLayout="column">
        <mat-form-field>
          <mat-label>Source</mat-label>
          <mat-select [(value)]="type">
            <mat-option value="youtube">YouTube</mat-option>
            <mat-option value="vimeo">Video</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Identifiant</mat-label>
          <label>
            <input matInput [(ngModel)]="videoId">
          </label>
        </mat-form-field>
      </mat-card-content>
    </mat-card>

    <mat-card *ngIf="editable || summary.length > 0">
      <mat-card-header>
        <mat-card-title>Sommaire</mat-card-title>
      </mat-card-header>

      <mat-card-content fxLayout="column" fxLayoutGap="8px" cdkDropList (cdkDropListDropped)="onDrag($event)">
        <div *ngFor="let s of summary; let i = index" (click)="goToTimestamp(summary[i].timestamp)"
             cdkDrag
             class="video-anchor-container"
             matRipple
             fxFlex="grow"
             fxLayout="row"
             fxLayoutGap="16px"
             fxLayoutAlign="center center">
          <mat-icon *ngIf="editable" cdkDragHandle>drag_indicator</mat-icon>
          <mat-icon>play_circle_filled</mat-icon>
          <mtx-video-brick-anchor [editable]="editable" [(timestamp)]="summary[i].timestamp"></mtx-video-brick-anchor>
          <div fxFlex="grow" [contenteditable]="editable" [(ngModel)]="summary[i].title"></div>
          <mat-icon *ngIf="editable" (click)="summary.splice(i, 1)">delete</mat-icon>
        </div>
      </mat-card-content>

      <mat-card-actions *ngIf="editable">
        <button mat-button (click)="summary.push({
          timestamp: 0,
          title: 'Nouvelle ancre'
        })">Ajouter une ancre
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
