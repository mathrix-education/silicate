<div fxLayout="row" fxLayoutGap="16px" fxLayoutAlign="center center">
  <div fxFlex="grow">
    <div class="player-handler ratio ratio-16-9" (click)="onClick($event)">
      <div *ngIf="loading" class="spinner-handler">
        <mat-spinner></mat-spinner>
      </div>

      <lib-ytplayer #youtubePlayer [videoId]="videoId" (ready)="loading = false"></lib-ytplayer>
    </div>
  </div>

  <mat-card fxFlex="30%">
    <mat-card-header>
      <mat-card-title>Sommaire</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <mat-list>
        <mat-list-item *ngFor="let s of summary; let i = index" (click)="goToTimestamp(summary[i].timestamp)">
          {{ summary[i].timestamp | videoTimestamp }}
          {{ summary[i].title }}
        </mat-list-item>
      </mat-list>
    </mat-card-content>
  </mat-card>
</div>
