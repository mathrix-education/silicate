<div fxLayoutGap="15px">
  <mat-form-field>
    <mat-select [(ngModel)]="componentRef.instance.style">
      <mat-option value="normal">Normal</mat-option>
      <mat-option value="secondary-title">Titre</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-button-toggle-group #format="matButtonToggleGroup">
    <mat-button-toggle (click)="componentRef.instance.wrap('bold')" aria-label="Bold" value="bold">
      <mat-icon>format_bold</mat-icon>
    </mat-button-toggle>
    <mat-button-toggle (click)="componentRef.instance.wrap('italic')" aria-label="Italic" value="italic">
      <mat-icon>format_italic</mat-icon>
    </mat-button-toggle>
    <mat-button-toggle (click)="openLinkDialog()" aria-label="Italic" value="italic">
      <mat-icon>link</mat-icon>
    </mat-button-toggle>
  </mat-button-toggle-group>
</div>
