<mat-menu #brickType="matMenu">
  <button
    *ngFor="let brick of silicate.bricksDeclarations"
    mat-menu-item
    (click)="select.emit(brick)"
    [disabled]="icon === brick.icon">
    <mat-icon>{{ brick.icon }}</mat-icon>
    {{ brick.name }}
  </button>
</mat-menu>

<button [matMenuTriggerFor]="brickType" mat-icon-button>
  <mat-icon>{{ icon }}</mat-icon>
</button>
