<div fxLayout="row"
     fxLayoutAlign="center center"
     fxLayoutGap="0px">
  <mat-menu #brickType="matMenu">
    <button (click)="brick = brickDeclarations[i].component.empty()"
            *ngFor="let brickDeclaration of brickDeclarations; let i = index"
            [disabled]="icon === brickDeclarations[i].icon"
            mat-menu-item>
      <mat-icon>{{ brickDeclarations[i].icon }}</mat-icon>
      {{ brickDeclarations[i].name }}
    </button>
  </mat-menu>

  <button *ngIf="editable"
          [matMenuTriggerFor]="brickType"
          mat-icon-button>
    <mat-icon>{{ icon }}</mat-icon>
  </button>

  <div fxFlex="grow">
    <ng-template #wrapper></ng-template>
  </div>

  <button (click)="clear()" *ngIf="editable" mat-icon-button>
    <mat-icon>delete</mat-icon>
  </button>
</div>
