<div fxLayout="row"
     fxLayoutAlign="center center"
     fxLayoutGap="0px">
  <mat-menu #brickType="matMenu">
    <button (click)="swap(declaration)"
            *ngFor="let declaration of declarations"
            [disabled]="icon === declaration.icon"
            mat-menu-item>
      <mat-icon>{{ declaration.icon }}</mat-icon>
      {{ declaration.displayName }}
    </button>
  </mat-menu>

  <button *ngIf="silicate.editable"
          [matMenuTriggerFor]="brickType"
          mat-icon-button>
    <mat-icon>{{ icon }}</mat-icon>
  </button>

  <div fxFlex="grow">
    <ng-template #wrapper></ng-template>
  </div>
</div>
