<div fxLayout="row"
     fxLayoutAlign="center center"
     fxLayoutGap="0px">
  <div fxLayout="column">
    <silicate-brick-selector
      *ngIf="silicate.editable"
      [icon]="icon"
      (select)="swap($event)">
    </silicate-brick-selector>

    <silicate-brick-selector
      *ngIf="silicate.editable"
      [icon]="'subdirectory_arrow_right'"
      (select)="insert($event)">
    </silicate-brick-selector>
  </div>

  <div fxFlex="grow">
    <ng-template #wrapper></ng-template>
  </div>

  <button (click)="wall.delete(index)"
          *ngIf="silicate.editable"
          mat-icon-button>
    <mat-icon>delete</mat-icon>
  </button>
</div>
