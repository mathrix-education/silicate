<div fxLayout="row"
     fxLayoutAlign="center center"
     fxLayoutGap="0px">
  <mat-menu #brickType="matMenu">
    <button mat-menu-item
            *ngFor="let brick of bricks"
            (click)="this.silicate.data[this.index] = brick.component.empty()"
            [disabled]="icon === brick.icon">
      <mat-icon>{{ brick.icon }}</mat-icon>
      {{ brick.displayName }}
    </button>
  </mat-menu>

  <button *ngIf="silicate.editable"
          mat-icon-button
          [matMenuTriggerFor]="brickType">
    <mat-icon>{{ icon }}</mat-icon>
  </button>

  <div fxFlex="grow">
    <ng-template #wrapper></ng-template>
  </div>

  <button *ngIf="silicate.editable"
          mat-icon-button
          (click)="silicate.delete(index)">
    <mat-icon>delete</mat-icon>
  </button>
</div>
