<div fxLayout="row"
     fxLayoutGap="0px"
     fxLayoutAlign="center center">
  <mat-menu #brickType="matMenu">
    <button *ngFor="let brickDeclaration of brickDeclarations; let i = index"
            mat-menu-item
            [disabled]="icon === brickDeclarations[i].icon"
            (click)="brick = brickDeclarations[i].component.empty()">
      <mat-icon>{{ brickDeclarations[i].icon }}</mat-icon>
      {{ brickDeclarations[i].name }}
    </button>
  </mat-menu>

  <button *ngIf="editable"
          mat-icon-button
          [matMenuTriggerFor]="brickType">
    <mat-icon>{{ icon }}</mat-icon>
  </button>

  <div fxFlex="grow">
    <ng-template #wrapper></ng-template>
  </div>

  <button *ngIf="editable" mat-icon-button (click)="onDelete()">
    <mat-icon>delete</mat-icon>
  </button>
</div>
