<div fxLayout="row"
     fxLayoutAlign="center center"
     fxLayoutGap="0px">
  <mat-menu #brickType="matMenu">
    <button
      *ngFor="let bd of brickDeclarations"
      (click)="swap(bd.factory)"
      [disabled]="icon === bd.icon"
      mat-menu-item>
      <mat-icon>{{ bd.icon }}</mat-icon>
      {{ bd.name }}
    </button>
  </mat-menu>

  <button *ngIf="silicate.editable"
          [matMenuTriggerFor]="brickType"
          mat-icon-button>
    <mat-icon>{{ icon }}</mat-icon>
  </button>

  <div fxFlex="grow">
    <ng-template #wrapper></ng-template>
  </div>
</div>
