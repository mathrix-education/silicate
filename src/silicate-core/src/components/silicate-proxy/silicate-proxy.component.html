<div fxLayout="row"
     fxLayoutAlign="center center"
     fxLayoutGap="0px">
  <mat-menu #brickType="matMenu">
    <button (click)="swap(factory)"
            *ngFor="let factory of container.brickFactories"
            [disabled]="icon === factory.icon"
            mat-menu-item>
      <mat-icon>{{ factory.icon }}</mat-icon>
      {{ factory.displayName }}
    </button>
  </mat-menu>

  <button *ngIf="silicate.editable"
          [matMenuTriggerFor]="brickType"
          mat-icon-button>
    <mat-icon>{{ icon }}</mat-icon>
  </button>

  <div fxFlex="grow">
    <ng-template #wrapper></ng-template>
  </div>
</div>
