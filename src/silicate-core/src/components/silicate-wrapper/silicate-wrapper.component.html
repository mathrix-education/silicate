<div class="wall"
     fxFlex
     fxLayout="column"
     cdkDropList
     [cdkDropListDisabled]="!silicate.editable"
     (cdkDropListDropped)="onDrag($event)">
  <div *ngFor="let brick of data; let i = index"
       cdkDrag
       class="brick-container"
       fxLayout="row"
       fxLayoutAlign="center center"
       fxLayoutGap="8px">
    <mat-icon *ngIf="silicate.editable" cdkDragHandle fxFlex>drag_indicator</mat-icon>

    <mtx-silicate-proxy fxFlex="grow" [index]="i"></mtx-silicate-proxy>
  </div>
</div>

<mtx-silicate-toolbar></mtx-silicate-toolbar>
