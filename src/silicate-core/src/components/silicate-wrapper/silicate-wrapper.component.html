<mat-card>
  <mat-card-content *ngIf="canEdit"
                    class="silicate-toolbar"
                    fxLayout="row"
                    fxLayoutAlign="start center"
                    fxLayoutGap="16px">
    <button [matMenuTriggerFor]="menu" mat-button>Fichier</button>

    <mat-menu #menu="matMenu">
      <button (click)="onNewBrick()" mat-menu-item>
        <mat-icon>add</mat-icon>
        <span>Nouveau bloc (Ctrl+N)</span>
      </button>
      <button mat-menu-item>
        <mat-icon>save</mat-icon>
        <span>Sauvegarder (Ctrl+S)</span>
      </button>
    </mat-menu>

    <div fxFlex="grow">
      <ng-template #toolbar></ng-template>
    </div>

    <mat-slide-toggle [(ngModel)]="silicate.editable"></mat-slide-toggle>
  </mat-card-content>
</mat-card>

<div class="wall"
     fxFlex
     fxLayout="column"
     cdkDropList
     [cdkDropListDisabled]="!silicate.editable"
     (cdkDropListDropped)="onDrag($event)">
  <div *ngFor="let brick of data; let i = index"
       cdkDrag
       class="brick-container"
       fxLayout="row"
       fxLayoutAlign="center center"
       fxLayoutGap="8px">
    <mat-icon *ngIf="silicate.editable" cdkDragHandle fxFlex>drag_indicator</mat-icon>

    <mtx-silicate-proxy fxFlex="grow" [index]="i"></mtx-silicate-proxy>
  </div>
</div>

<mtx-silicate-toolbar></mtx-silicate-toolbar>

<mtx-silicate-debug *ngIf="debug" [debug]="data"></mtx-silicate-debug>
