<div (cdkDropListDropped)="onDrag($event)"
     [cdkDropListDisabled]="!silicate.editable"
     cdkDropList
     class="wall"
     fxFlex
     fxLayout="column">
  <div *ngFor="let brick of (wall.wall$ | async); let i = index; trackBy: trackByFn"
       cdkDrag
       class="brick-container"
       fxLayout="row"
       fxLayoutAlign="center center"
       fxLayoutGap="8px">
    <mat-icon *ngIf="silicate.editable" cdkDragHandle fxFlex>drag_indicator</mat-icon>

    <silicate-proxy [index]="i" fxFlex="grow"></silicate-proxy>

    <button (click)="wall.delete(i)"
            *ngIf="silicate.editable"
            mat-icon-button>
      <mat-icon>delete</mat-icon>
    </button>
  </div>
</div>

<silicate-toolbar *ngIf="root"></silicate-toolbar>
