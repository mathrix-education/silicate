<mat-card>
  <mat-card-content *ngIf="canEdit"
                    class="silicate-toolbar"
                    fxLayout="row"
                    fxLayoutAlign="start center"
                    fxLayoutGap="16px">
    <button [matMenuTriggerFor]="menu" mat-button>Fichier</button>

    <mat-menu #menu="matMenu">
      <button (click)="onNewBrick()" mat-menu-item>
        <mat-icon>add</mat-icon>
        <span>Nouveau bloc (Ctrl+N)</span>
      </button>
      <button mat-menu-item>
        <mat-icon>save</mat-icon>
        <span>Sauvegarder (Ctrl+S)</span>
      </button>
    </mat-menu>

    <div fxFlex="grow">
      <ng-template #toolbar></ng-template>
    </div>

    <mat-slide-toggle [(ngModel)]="editable"></mat-slide-toggle>
  </mat-card-content>
</mat-card>

<div (cdkDropListDropped)="onDrag($event)"
     [cdkDropListDisabled]="!editable"
     cdkDropList
     class="wall"
     fxFlex
     fxLayout="column">
  <div *ngFor="let brick of data; let i = index"
       cdkDrag
       class="brick-container"
       fxLayout="row"
       fxLayoutAlign="center center"
       fxLayoutGap="8px">
    <mat-icon *ngIf="editable" cdkDragHandle fxFlex>drag_indicator</mat-icon>

    <mtx-silicate-proxy (delete)="onDelete(i)"
                        [(brick)]="model.data[i]"
                        [additionalBricks]="additionalBricks"
                        [editable]="editable"
                        class="example-box"
                        fxFlex="grow">
    </mtx-silicate-proxy>
  </div>
</div>

<mtx-silicate-debug *ngIf="debug" [debug]="data"></mtx-silicate-debug>
