<mat-card>
  <mat-card-content *ngIf="canEdit"
                    class="silicate-toolbar"
                    fxLayout="row"
                    fxLayoutGap="16px"
                    fxLayoutAlign="start center">
    <button mat-button [matMenuTriggerFor]="menu">Fichier</button>

    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="onNewBrick()">
        <mat-icon>add</mat-icon>
        <span>Nouveau bloc (Ctrl+N)</span>
      </button>
      <button mat-menu-item>
        <mat-icon>save</mat-icon>
        <span>Sauvegarder (Ctrl+S)</span>
      </button>
    </mat-menu>

    <div fxFlex="grow">
      <ng-template #toolbar></ng-template>
    </div>

    <mat-slide-toggle [(ngModel)]="editable"></mat-slide-toggle>
  </mat-card-content>
</mat-card>

<div class="wall"
     cdkDropList
     fxFlex
     fxLayout="column"
     [cdkDropListDisabled]="!editable"
     (cdkDropListDropped)="onDrag($event)">
  <div *ngFor="let brick of data; let i = index; trackBy: trackByFn"
       class="brick-container"
       cdkDrag
       fxLayout="row"
       fxLayoutGap="8px"
       fxLayoutAlign="center center">
    <mat-icon cdkDragHandle fxFlex *ngIf="editable">drag_indicator</mat-icon>

    <mtx-silicate-proxy class="example-box"
                        fxFlex="grow"
                        [editable]="editable"
                        (delete)="onDelete(i)"
                        [(brick)]="data[i]">
    </mtx-silicate-proxy>
  </div>
</div>

<mtx-silicate-debug *ngIf="debug" [debug]="data"></mtx-silicate-debug>
