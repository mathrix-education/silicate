<h1 mat-dialog-title>Choix de l'image</h1>
<div mat-dialog-content>
  <mat-form-field>
    <mat-label>URL de l'image</mat-label>
    <input [(ngModel)]="data.src"
           matInput
           placeholder="https://placehold.it/400x150"
           type="url">
  </mat-form-field>

  <mat-form-field>
    <mat-label>Texte alternatif</mat-label>
    <input [(ngModel)]="data.alt"
           matInput
           placeholder="Description"
           type="text">
  </mat-form-field>
</div>

<div mat-dialog-actions>
  <button (click)="dialogRef.close()" mat-button>Annuler</button>
  <button [mat-dialog-close]="data" cdkFocusInitial mat-button>Sauvegarder</button>
</div>
