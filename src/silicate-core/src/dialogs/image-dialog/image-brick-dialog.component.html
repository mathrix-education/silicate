<h1 mat-dialog-title>Choix de l'image</h1>
<div mat-dialog-content>
  <div fxLayout="column">
    <mat-form-field>
      <mat-label>URL de l'image</mat-label>
      <label>
        <input [(ngModel)]="data.src"
               matInput
               type="url"
               placeholder="https://placehold.it/400x150">
      </label>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Texte alternatif</mat-label>
      <label>
        <input [(ngModel)]="data.alt"
               matInput
               type="text"
               placeholder="Description">
      </label>
    </mat-form-field>
  </div>
</div>

<div mat-dialog-actions>
  <button mat-button (click)="dialogRef.close()">Fermer</button>
  <button mat-button [mat-dialog-close]="data">Sauvegarder</button>
</div>
