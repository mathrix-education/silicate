steps:
  - id: 'yarn:install'
    name: 'node:11-alpine'
    entrypoint: 'yarn'
    args: ['install']

  # Build silicate libraries and demo
  # ---------------------------------
  - id: 'ng:build'
    name: 'node:11-alpine'
    waitFor: ['yarn:install']
    entrypoint: 'ash'
    args:
      - '-c'
      - |
        rm -rf node_modules/@mathrix
        yarn run ng build silicate-core
        yarn run ng build silicate-education
        yarn run ng build silicate-essentials
        yarn run ng build silicate-latex
        yarn run ng build silicate-videos
        yarn run ng build silicate-demo --prod

  # Deploy libraries
  # ----------------
  - id: 'gcloud:kms:decrypt'
    name: 'gcr.io/cloud-builders/gcloud'
    waitFor: ['ng:build']
    entrypoint: 'bash'
    args: ['deploy/scripts/decrypt.sh']
  - id: 'npm:publish'
    name: 'node:11-alpine'
    waitFor: ['gcloud:kms:decrypt']
    entrypoint: 'ash'
    args:
      - -c
      - |
        deploy/scripts/setup_registry.sh
        deploy/scripts/publish.sh -p silicate-core -c $SHORT_SHA -t $TAG_NAME
        deploy/scripts/publish.sh -p silicate-education -c $SHORT_SHA -t $TAG_NAME
        deploy/scripts/publish.sh -p silicate-essentials -c $SHORT_SHA -t $TAG_NAME
        deploy/scripts/publish.sh -p silicate-latex -c $SHORT_SHA -t $TAG_NAME
        deploy/scripts/publish.sh -p silicate-videos -c $SHORT_SHA -t $TAG_NAME


  # Deploy demo
  # -----------
  - id: 'docker:build'
    waitFor: ['npm:publish']
    name: 'gcr.io/cloud-builders/docker'
    args: ['build',
           '-t', 'eu.gcr.io/$PROJECT_ID/silicate-demo:$SHORT_SHA',
           '.']
  - id: 'docker:push'
    waitFor: ['docker:build']
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'eu.gcr.io/$PROJECT_ID/silicate-demo:$SHORT_SHA']
  - id: 'cloud-run:deploy'
    waitFor: ['docker:push']
    name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud beta run deploy silicate-demo \
          --image eu.gcr.io/$PROJECT_ID/silicate-demo:$SHORT_SHA \
          --region us-central1
images: ['eu.gcr.io/$PROJECT_ID/silicate-demo:$SHORT_SHA']
tags: ['silicate', 'demo']
