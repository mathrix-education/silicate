steps:
  - id: 'yarn:install'
    name: 'node:11-alpine'
    entrypoint: 'yarn'
    args: ['install']

  # Build silicate libraries and demo
  # ---------------------------------
  - id: 'ng:build'
    name: 'node:11-alpine'
    waitFor: ['yarn:install']
    entrypoint: 'ash'
    args:
    - '-c'
    - |
      deploy/scripts/build.sh silicate-core
      deploy/scripts/build.sh silicate-latex
      deploy/scripts/build.sh silicate-videos
    # yarn run ng build silicate-demo --prod

  # Deploy libraries
  # ----------------
  - id: 'gcloud:kms:decrypt'
    name: 'gcr.io/cloud-builders/gcloud'
    waitFor: ['ng:build']
    entrypoint: 'bash'
    volumes:
      - name: 'ssh'
        path: /root/.ssh
    args: ['deploy/scripts/decrypt.sh']
  - id: 'git:push'
    name: 'gcr.io/cloud-builders/git'
    waitFor: ['gcloud:kms:decrypt']
    entrypoint: 'bash'
    args:
      - -c
      - |
        deploy/scripts/setup_ssh.sh
        deploy/scripts/push.sh silicate-core
        deploy/scripts/push.sh silicate-latex
        deploy/scripts/push.sh silicate-videos

  # Deploy demo
  # -----------
  - id: 'docker:build'
    waitFor: ['git:push']
    name: 'gcr.io/cloud-builders/docker'
    args: ['build',
           '-t', 'eu.gcr.io/$PROJECT_ID/silicate-demo:$SHORT_SHA',
           '.']
  - id: 'docker:push'
    waitFor: ['docker:build']
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'eu.gcr.io/$PROJECT_ID/silicate-demo:$SHORT_SHA']
  - id: 'cloud-run:deploy'
    waitFor: ['docker:push']
    name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud beta run deploy silicate-demo \
          --image eu.gcr.io/$PROJECT_ID/silicate-demo:$SHORT_SHA \
          --region us-central1
images: ['eu.gcr.io/$PROJECT_ID/silicate-demo:$SHORT_SHA']
tags: ['silicate', 'demo']
