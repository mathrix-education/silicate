#options:
#  machineType: 'N1_HIGHCPU_8'
steps:
  - id: 'yarn:install'
    name: 'node:11-alpine'
    entrypoint: 'ash'
    args:
      - -c
      - |
        yarn install
        rm -rf node_modules/@mathrix

  # Build silicate libraries and demo
  # ---------------------------------
  - id: 'ng:build:silicate-core'
    name: 'node:11-alpine'
    waitFor: ['yarn:install']
    entrypoint: 'yarn'
    args: ['run', 'ng', 'build', 'silicate-core']
  - id: 'ng:build:silicate-education'
    name: 'node:11-alpine'
    waitFor: ['ng:build:silicate-core']
    entrypoint: 'yarn'
    args: ['run', 'ng', 'build', 'silicate-education']
  - id: 'ng:build:silicate-essentials'
    name: 'node:11-alpine'
    waitFor: ['ng:build:silicate-core']
    entrypoint: 'yarn'
    args: ['run', 'ng', 'build', 'silicate-essentials']
  - id: 'ng:build:silicate-latex'
    name: 'node:11-alpine'
    waitFor: ['ng:build:silicate-core']
    entrypoint: 'yarn'
    args: ['run', 'ng', 'build', 'silicate-latex']
  - id: 'ng:build:silicate-videos'
    name: 'node:11-alpine'
    waitFor: ['ng:build:silicate-core']
    entrypoint: 'yarn'
    args: ['run', 'ng', 'build', 'silicate-videos']


  # Deploy libraries to verdaccio.mathrix.fr
  # ----------------------------------------
  - id: 'gcloud:kms:decrypt'
    name: 'gcr.io/cloud-builders/gcloud'
    # waitFor: ['ng:build:browser', 'ng:build:server']
    waitFor:
      - 'ng:build:silicate-education'
      - 'ng:build:silicate-essentials'
      - 'ng:build:silicate-latex'
      - 'ng:build:silicate-videos'
    entrypoint: 'bash'
    args: ['deploy/scripts/decrypt.sh']
  - id: 'npm:publish'
    name: 'node:11-alpine'
    waitFor: ['gcloud:kms:decrypt']
    entrypoint: 'ash'
    args:
      - -c
      - |
        deploy/scripts/setup_registry.sh
        deploy/scripts/publish.sh -p silicate-core -c $SHORT_SHA -t $TAG_NAME
        deploy/scripts/publish.sh -p silicate-education -c $SHORT_SHA -t $TAG_NAME
        deploy/scripts/publish.sh -p silicate-essentials -c $SHORT_SHA -t $TAG_NAME
        deploy/scripts/publish.sh -p silicate-latex -c $SHORT_SHA -t $TAG_NAME
        deploy/scripts/publish.sh -p silicate-videos -c $SHORT_SHA -t $TAG_NAME
tags: ['silicate', 'demo']
