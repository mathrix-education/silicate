name: Publish
on: [push]  # Always
jobs:
  build:
    strategy:
      lib: [silicate-essentials, silicate-education, silicate-latex, silicate-videos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v1
      - name: Setup Node.js 12.x
        uses: actions/setup-node@v1
        with:
          node-version: 12.x
      - name: Install
        run: npm install
      - name: Build @mathrix-education/silicate-core
        run: |
          npm run ng build silicate-core
          if [ -n git diff --name-only HEAD~1 HEAD | grep src/silicate-core/composer.json ]; then
            cd dist/silicate-core
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build and publish
        run: |
          if [ -n git diff --name-only HEAD~1 HEAD | grep src/${{ matrix.lib }}/composer.json ]; then
            npm run ng build ${{ matrix.lib }}
            cd dist/${{ matrix.lib }}
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
